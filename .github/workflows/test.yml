name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-suite:
    name: offline suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The offline suite is credential-free by construction. `test:wire` talks
      # to a real relay with a real key and is deliberately NOT run here — it is
      # named wire-live.js, not *.test.js, so `npm test` cannot pick it up.
      - run: npm test

  provenance:
    name: provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan added lines for provenance vocabulary
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          scripts/check-provenance.sh "$base"
